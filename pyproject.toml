[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rag-debugger-amine"
version = "0.2.0"
description = "Intercept, inspect, and fix your RAG retrieval pipeline"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Amine Fezzani", email = "mohamedaminefezzani@gmail.com" }]
keywords = ["rag", "llm", "retrieval", "debugging", "embeddings", "vector-database"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24",
    "google-generativeai>=0.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]
langchain = [
    "langchain>=0.2",
]
llamaindex = [
    "llama-index>=0.10",
]
dashboard = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.urls]
Homepage = "https://github.com/mohamedaminefezzani/rag-debugger"
Documentation = "https://github.com/mohamedaminefezzani/rag-debugger#readme"
Issues = "https://github.com/mohamedaminefezzani/rag-debugger/issues"

[tool.hatch.build.targets.wheel]
packages = ["rag_debugger"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
